<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldPheno4D Dataset</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>{{ title }}</h1>
            <div class="dataset-description">{{ description|safe }}</div>
        </div>
        <button id="theme-toggle" class="theme-toggle">Toggle theme</button>
    </header>

    <main>
        <!-- Block 1: Highlights -->
        <section class="block highlights">
            <div class="block-inner">
                <h2>Highlights</h2>
                <div class="dataset-description">This section is reserved for a short highlight summary.</div>
            </div>
        </section>

        <!-- Block 2: 3D point clouds (tabs + viewer) -->
        <section class="block pointclouds">
            <div class="block-inner">
                <h2>3D point clouds</h2>
                <div id="plots-grid" class="plots-grid"></div>
            </div>
        </section>

        <!-- Block 3: Acknowledgments -->
        <section class="block acknowledgments">
            <div class="block-inner">
                <h2>Acknowledgments</h2>
                <div class="ack-text">{{ acknowledgments|safe }}</div>
            </div>
        </section>
    </main>

    <script>
        window.DOWNLOAD_LINKS = {{ download_links | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <div class="site-badge" aria-hidden="true">
        <div class="site-badge-logos">
            <div class="site-badge-logo site-badge-logo--left">
                <img src="{{ url_for('static', filename='images/logo_phenorob.png') }}" alt="PHENOROB logo">
            </div>
            <div class="site-badge-logo site-badge-logo--right">
                <img src="{{ url_for('static', filename='images/logo_unibonn.png') }}" alt="University of Bonn logo">
            </div>
        </div>
        <div class="copyright">Copyright © 2026 University of Bonn</div>
    </div>
</body>
</html>
