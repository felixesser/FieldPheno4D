[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "pointcloudlib"
version = "0.1.0"
description = "Point Cloud Processing Library"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cloth-simulation-filter>=1.1.7",
    "colorama>=0.4.6",
    "laspy>=2.6.1",
    "matplotlib>=3.7.0",
    "numpy>=1.23,<3.0",
    "open3d>=0.19.0",
    "plyfile>=1.1.3",
    "pyransac3d>=0.6.0",
    "pyvista>=0.46.4",
    "rasterio>=1.3.10",
    "rich>=14.2.0",
    "scikit-learn>=1.7.2",
    "sympy>=1.14.0",
]
